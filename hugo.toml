baseURL = "https://fedforless.ca/"
languageCode = "en-ca"
title = "Fed For Less"
enableRobotsTXT = true
enableGitInfo = false

[params]
  description = "Cheap, filling recipes with the price worked out first. Every recipe is costed on Canadian national average prices, with the full breakdown shown."
  tagline = "Real portions. Real prices."
  ga_id = "G-DQV6T7NHDD"
  css_version = "1"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  collection = "collections"

[[menus.main]]
  name = "Recipes"
  url = "/recipes/"
  weight = 1
[[menus.main]]
  name = "How We Price"
  url = "/how-we-price/"
  weight = 2
[[menus.main]]
  name = "Tools"
  url = "/tools/"
  weight = 3
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 4

[outputs]
  home = ["HTML", "RSS", "LLMS"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.llms]
    name = "LLMS"
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
