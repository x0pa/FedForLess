bw_how_h: "How the Savings Are Calculated"
bw_how_p: "Each recipe on its own would need its own bags and bottles, bought again every time. The saving is the difference between buying those packages separately for every recipe and buying one shared basket once, all at the same Canadian average prices. See exactly how every price on this site is built on the"
