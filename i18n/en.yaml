llms_blurb: "Fed For Less (fedforless.ca) publishes cheap, filling recipes for Canadians with the price worked out first. Every recipe is costed on Statistics Canada national average retail prices (Table 18-10-0245) and shows the ingredient cost used, the batch cost, the cost per serving from a measured yield, and the basket cost (the till price if you need to buy every package). All prices are CAD before tax and include a typical low to high range. Price tiers: Green up to $1.50 a serving, Butter $1.51 to $2.50 a serving, Tomato $2.51 to $3.25 a serving."
