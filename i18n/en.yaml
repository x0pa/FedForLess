ab_eyebrow: "The Story Behind Fed For Less"
ab_h1_l1: "Good Food."
ab_h1_l2: "Real Portions."
ab_h1_l3: "Small Prices."
ab_intro_1: "Fed For Less exists because of a simple frustration: most budget recipes are only cheap if you squint."
ab_intro_2: "Too many budget recipes only work if the portions are tiny, half the ingredients are already in your pantry, or the prices come from another country, another year, or one magical store."
ab_feat_h1: "A Full Plate."
ab_feat_h2: "Not a Footnote."
ab_feat_p: "The other rule is just as strict: a recipe has to fill the plate. Portions are the size a hungry adult actually eats. If a dish needs a side to feel like dinner, the side goes in the recipe and in the price, not in a footnote."
ab_feat_link: "Browse the Recipes"
ab_prom_h: "Four Things We Don't Compromise On"
ab_p1_h: "Every Ingredient Counts"
ab_p1_p: "Every ingredient used in a recipe is accounted for, including small pantry items."
ab_p2_h: "Real Servings"
ab_p2_p: "We price portions that actually make a meal, not tiny servings designed to make the number look better."
ab_p3_h: "The Full Batch Matters"
ab_p3_p: "Every recipe shows what all the ingredients used cost together, not just a theoretical single serving."
ab_p4_h: "The Grocery Bill Matters Too"
ab_p4_p: "We show what buying the required grocery packages costs, because the amount at checkout can be very different from the amount used in the recipe."
ab_ex_h: "The Numbers Are Part of the Recipe."
ab_ex_cta: "See the Full Recipe Breakdown"
ab_ca_eyebrow: "Built in Winnipeg"
ab_ca_h1: "Canadian Food."
ab_ca_h2: "Canadian Prices."
ab_ca_p1: "Here, the price is part of the recipe. Every dish shows what the ingredients used cost, what the whole batch costs, what one real serving costs, and what you would pay at the till if you had to buy every package from an empty pantry."
ab_ca_p2: "The figures come from Statistics Canada's published average retail prices, checked against national grocery chains, and the month they were checked is printed on the recipe."
ab_ca_p3: "Fed For Less is a Canadian site, published by Dark Haus Studio in Winnipeg. Prices are Canadian dollars, before tax, on national averages, with a typical range on every recipe so readers in pricier and cheaper regions can place themselves honestly."
ab_ca_cta: "See How We Price Every Recipe"
ab_stmt_h1: "No Mystery Prices."
ab_stmt_h2: "No Tiny Servings."
ab_stmt_p: "Good food shouldn't cost a fortune. And knowing what dinner costs shouldn't require guesswork."
ab_corr_h: "If a Number Is Wrong, Tell Us."
ab_corr_p: "Questions, corrections, and pricing information from your local grocery store are always welcome. If we've made a mistake, we want to know so we can correct it. If a number here is wrong, we will fix it with a note on the recipe."
ab_corr_cta: "Contact Fed For Less"
ab_fin_h: "Ready to Eat Well for Less?"
ab_fin_p: "Explore affordable, filling recipes with the real cost breakdown before you shop."
