pv_s1_intro: "Fed For Less is a recipe website. You can read everything here without an account."
pv_c1_h: "Analytics"
pv_c1_p: "We use Google Analytics to understand which recipes readers use, in aggregate. Analytics cookies record things like pages visited, approximate location at the city level, and device type. We do not receive your name or address from analytics."
pv_c2_h: "Advertising"
pv_c2_p: "When ads run on this site, the ad network may use cookies to measure ad performance and, where you have consented through your own browser or account settings, to personalize ads."
pv_c3_h: "Email"
pv_c3_p: "If you join the mailing list, we keep the email address you gave us for the purpose of sending the newsletter. We do not sell email addresses. Every email includes an unsubscribe link, and unsubscribing removes you from future sends."
pv_c4_h: "Contact Messages"
pv_c4_p: "If you write to us, we keep your message so we can reply and, where relevant, correct site content."
pv_d1: "We do not sell personal information."
pv_d2: "We do not require accounts, and we do not collect payment information. Nothing is sold directly on this site."
pv_d3: "We do not knowingly collect information from children."
pv_choices_p: "You can block or delete cookies in your browser settings, use your browser's tracking protection, and unsubscribe from email at any time. If you would like a copy of information you sent us, or would like it deleted, contact us and we will take care of it."
