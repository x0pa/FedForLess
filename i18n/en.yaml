hw_eyebrow: "The Numbers Behind the Meals"
hw_h1_l1: "How We Price"
hw_h1_l2: "Every Recipe."
hw_intro: "Every recipe on this site carries four numbers. This page explains exactly where each one comes from, because a price you cannot check is just a claim."
hw_t1_h: "Canadian Data"
hw_t1_p: "Official published price statistics where available."
hw_t2_h: "Retail Price Checks"
hw_t2_p: "Regular grocery catalogue prices for items not covered by government tables."
hw_t3_h: "Full Breakdowns"
hw_t3_p: "Ingredient costs, batch totals, per serving costs, and basket purchase costs."
hw_four_h: "Every Recipe. Four Numbers."
hw_n1_h: "Ingredient Cost"
hw_n1_p: "What the amounts in the recipe cost, pro rated from the package."
hw_n1_ex: "If a 900 g bag costs $4.00 and a recipe uses 450 g, the ingredient cost is $2.00."
hw_n2_h: "Batch Total"
hw_n2_p: "The combined cost of all ingredients actually used: the whole pot, pan, or tray."
hw_n3_h: "Cost Per Serving"
hw_n3_p: "The batch total divided by the tested yield. Servings are real portions, the size a hungry adult eats, and the yield is stated on the recipe."
hw_n4_h: "Basket Cost"
hw_n4_p: "What you pay at the till if you need every package on the list. A recipe can cost $1.34 a serving and still need a $30 basket the first time, and we would rather show you both numbers than surprise you at the store."
hw_math_h: "See the Math in Action"
hw_math_a: "The worked example is"
hw_math_p: "This is the same receipt the recipe page prints, built from the same data. Open the recipe for every ingredient line, the price range that goes with it, and the full method."
hw_full_bd: "See the full recipe breakdown"
hw_src_h: "The Sources"
hw_sa_l: "Source A"
hw_sa_h: "Government Price Data"
hw_sa_p1: "The backbone is Statistics Canada Table 18-10-0245, monthly average retail prices for selected products, published for Canada and for each province."
hw_sa_p2: "It covers the staples this site cooks with: lentils and dry beans, potatoes, carrots, onions, cabbage, rice, pasta, eggs, milk, cheese, canned tomatoes, frozen vegetables, and the common cuts of chicken, pork, and beef. The table appears on Statistics Canada's own publication schedule, so its reference month can differ from the date of an individual retail check."
hw_sa_link: "Statistics Canada Table 18-10-0245"
hw_sb_l: "Source B"
hw_sb_h: "Grocery Catalogue Checks"
hw_sb_p1: "Where the table does not list an item, we price it from the current regular price in a national chain's public online catalogue, and say so on the recipe."
hw_sb_p2: "Store brands are the default buy: No Name, President's Choice, Compliments, Great Value, and their peers. Figures are Canadian dollars, before tax."
hw_dates_h: "Three Dates, Three Meanings"
hw_d1_h: "Government Reference Month"
hw_d1_p: "The month the Statistics Canada table describes."
hw_d2_h: "Retail Check Date"
hw_d2_p: "When a catalogue price was checked for an item the table does not cover, noted on the recipe."
hw_d3_h: "Recipe Prices Checked"
hw_d3_p: "The month printed on each recipe, when its pricing was last reviewed."
hw_rules_h: "The Rules We Follow"
hw_r1_h: "Regular Prices First"
hw_r1_p: "Regular prices carry the headline. A sale can be mentioned, and a recipe built around a sale is labelled sale priced with the regular price result shown too. A number that only works during one flyer week is not a budget recipe."
hw_r2_h: "Show the Range"
hw_r2_p: "Every figure carries a range. A typical low to high range sits beside the headline price, built from the provincial figures and package choices in the same sources. National averages are a planning tool, not a promise about one store on one day."
hw_r3_h: "Date Every Price"
hw_r3_p: "Sources and the month checked are printed on the recipe. Prices are rechecked on a rhythm: the most visited recipes monthly, the rest quarterly, oldest first. When a recheck moves a recipe to a different price tier, the recipe gets a visible update note with the new date and the new cost per serving."
hw_r4_h: "Account for Pantry Items"
hw_r4_p: "Small pantry items are an allowance, and it is labelled. Salt, pepper, dried spices, and garlic are costed as a small flat allowance per recipe rather than pretending a teaspoon of paprika has a knowable price. The allowance is in the breakdown where you can see it."
hw_r5_h: "Real Servings"
hw_r5_p: "A serving is never shrunk to hit a number. A recipe that misses its tier gets a cheaper protein, a different package, or a seasonal swap, or it is relabelled at the honest tier."
hw_tiers_h: "Three Tiers. No Guesswork."
hw_td1: "The core bargain tier, and where breakfasts and most soups live."
hw_td2: "The normal dinner tier."
hw_td3: "A filling splurge, used rarely and labelled honestly."
hw_not_h: "What These Prices Aren't"
hw_not_p: "They are not a live shelf price for your store, and they are not a guarantee. They are a careful, sourced estimate that tells you what a recipe should cost within a known range, so you can plan a week of dinners without doing arithmetic in the aisle. If your store beats the range, that is a good day. Tell us, and the range gets better."
hw_cta_h: "Now You Know the Numbers."
hw_cta_p: "Find a meal that fits your budget."
