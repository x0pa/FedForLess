bw_cta_sub: "Recettes complètes, liste d'épicerie et détail des prix."
bw_how_h: "Comment les économies sont calculées"
bw_how_p: "Chaque recette prise seule exigerait ses propres sacs et bouteilles, rachetés chaque fois. L'économie est la différence entre l'achat de ces emballages séparément pour chaque recette et l'achat d'un seul panier partagé, toujours aux mêmes prix moyens canadiens. Voyez exactement comment chaque prix de ce site est construit sur la"
bw_how_link: "page Notre méthode"
bw_more_h: "Autres semaines à un panier"
bw_save_l: "Vous économisez"
hw_eyebrow: "Les chiffres derrière les repas"
hw_h1_l1: "Comment nous fixons"
hw_h1_l2: "le prix de chaque recette."
hw_intro: "Chaque recette de ce site affiche quatre chiffres. Cette page explique exactement d'où vient chacun d'eux, parce qu'un prix impossible à vérifier n'est qu'une affirmation."
hw_t1_h: "Données canadiennes"
hw_t1_p: "Les statistiques de prix officielles publiées, quand elles existent."
hw_t2_h: "Vérifications au détail"
hw_t2_p: "Les prix réguliers des catalogues d'épicerie pour les articles absents des tableaux gouvernementaux."
hw_t3_h: "Détails complets"
hw_t3_p: "Coûts des ingrédients, totaux de recette, coûts par portion et coûts du panier."
hw_four_h: "Chaque recette. Quatre chiffres."
hw_n1_h: "Coût des ingrédients"
hw_n1_p: "Ce que coûtent les quantités de la recette, calculé au prorata de l'emballage."
hw_n1_ex: "Si un sac de 900 g coûte 4,00 $ et qu'une recette en utilise 450 g, le coût de l'ingrédient est de 2,00 $."
hw_n2_h: "Coût de la recette"
hw_n2_p: "Le coût combiné de tous les ingrédients réellement utilisés : toute la casserole, la poêle ou le plat."
hw_n3_h: "Coût par portion"
hw_n3_p: "Le coût de la recette divisé par le rendement testé. Les portions sont de vraies portions, la taille que mange un adulte qui a faim, et le rendement est indiqué sur la recette."
hw_n4_h: "Coût du panier"
hw_n4_p: "Ce que vous payez à la caisse s'il vous faut chaque emballage de la liste. Une recette peut coûter 1,34 $ la portion et exiger quand même un panier de 30 $ la première fois, et nous préférons vous montrer les deux chiffres plutôt que de vous surprendre au magasin."
hw_math_h: "Les chiffres en action"
hw_math_a: "L'exemple détaillé est"
hw_math_p: "C'est le même reçu que la page de la recette affiche, bâti à partir des mêmes données. Ouvrez la recette pour chaque ligne d'ingrédient, la fourchette qui l'accompagne et la méthode complète."
hw_full_bd: "Voir le détail complet de la recette"
hw_src_h: "Les sources"
hw_sa_l: "Source A"
hw_sa_h: "Données gouvernementales sur les prix"
hw_sa_p1: "La base est le tableau 18-10-0245 de Statistique Canada, les prix de détail moyens mensuels de produits choisis, publiés pour le Canada et pour chaque province."
hw_sa_p2: "Il couvre les aliments de base que ce site cuisine : lentilles et haricots secs, pommes de terre, carottes, oignons, chou, riz, pâtes, œufs, lait, fromage, tomates en conserve, légumes congelés et les coupes courantes de poulet, de porc et de bœuf. Le tableau paraît selon le calendrier de publication de Statistique Canada, alors son mois de référence peut différer de la date d'une vérification au détail."
hw_sa_link: "Tableau 18-10-0245 de Statistique Canada"
hw_sb_l: "Source B"
hw_sb_h: "Vérifications des catalogues d'épicerie"
hw_sb_p1: "Quand le tableau ne liste pas un produit, nous le chiffrons au prix régulier courant du catalogue en ligne public d'une chaîne nationale, et nous le disons sur la recette."
hw_sb_p2: "Les marques maison sont l'achat par défaut : Sans nom, Le Choix du Président, Compliments, Great Value et leurs semblables. Les chiffres sont en dollars canadiens, avant taxes."
hw_dates_h: "Trois dates, trois sens"
hw_d1_h: "Mois de référence gouvernemental"
hw_d1_p: "Le mois que décrit le tableau de Statistique Canada."
hw_d2_h: "Date de vérification au détail"
hw_d2_p: "Le moment où le prix d'un catalogue a été vérifié pour un article absent du tableau, indiqué sur la recette."
hw_d3_h: "Prix de la recette vérifiés"
hw_d3_p: "Le mois imprimé sur chaque recette, celui de sa dernière révision de prix."
hw_rules_h: "Les règles que nous suivons"
hw_r1_h: "Les prix réguliers d'abord"
hw_r1_p: "Les prix réguliers font le titre. Un rabais peut être mentionné, et une recette construite autour d'un rabais est étiquetée comme telle, avec le résultat au prix régulier aussi. Un chiffre qui ne fonctionne que durant une semaine de circulaire n'est pas une recette économique."
hw_r2_h: "Montrer la fourchette"
hw_r2_p: "Chaque chiffre vient avec une fourchette. Une fourchette typique, du plus bas au plus haut, accompagne le prix en titre, construite à partir des chiffres provinciaux et des choix d'emballages des mêmes sources. Les moyennes nationales sont un outil de planification, pas une promesse sur un magasin un jour donné."
hw_r3_h: "Dater chaque prix"
hw_r3_p: "Les sources et le mois de la vérification sont imprimés sur la recette. Les prix sont revérifiés selon un rythme : les recettes les plus visitées chaque mois, les autres chaque trimestre, les plus anciennes en premier. Quand une revérification fait passer une recette à un autre palier de prix, la recette reçoit une note de mise à jour visible avec la nouvelle date et le nouveau coût par portion."
hw_r4_h: "Compter le garde manger"
hw_r4_p: "Les petits articles du garde manger forment une allocation, et elle est étiquetée. Le sel, le poivre, les épices séchées et l'ail sont chiffrés comme une petite allocation fixe par recette, plutôt que de prétendre qu'une cuillère à thé de paprika a un prix connaissable. L'allocation paraît dans le détail, là où vous pouvez la voir."
hw_r5_h: "De vraies portions"
hw_r5_p: "Une portion ne rétrécit jamais pour atteindre un chiffre. Une recette qui rate son palier reçoit une protéine moins chère, un autre emballage ou un échange de saison, ou elle est étiquetée honnêtement au bon palier."
hw_tiers_h: "Trois paliers. Aucune devinette."
hw_td1: "Le palier des vraies aubaines, là où vivent les déjeuners et la plupart des soupes."
hw_td2: "Le palier normal du souper."
hw_td3: "Une petite folie rassasiante, utilisée rarement et étiquetée honnêtement."
hw_not_h: "Ce que ces prix ne sont pas"
hw_not_p: "Ils ne sont pas le prix en tablette en direct de votre magasin, et ils ne sont pas une garantie. Ce sont des estimations soignées et sourcées qui vous disent ce qu'une recette devrait coûter à l'intérieur d'une fourchette connue, pour planifier une semaine de soupers sans faire de calculs dans l'allée. Si votre magasin bat la fourchette, c'est une bonne journée. Dites le nous, et la fourchette s'améliorera."
hw_cta_h: "Vous connaissez maintenant les chiffres."
hw_cta_p: "Trouvez un repas qui respecte votre budget."
hw_cta_b: "Voir toutes les recettes"
hw_view_recipe: "Voir la recette"
