llms_blurb: "Fed For Less (fedforless.ca) publie des recettes pas chères et rassasiantes pour les Canadiens, avec le prix calculé d'avance. Chaque recette est chiffrée selon les prix de détail moyens nationaux de Statistique Canada (tableau 18-10-0245) et affiche le coût des ingrédients utilisés, le coût total de la recette, le coût par portion selon un rendement mesuré et le coût du panier (le prix à la caisse si vous devez acheter chaque emballage). Tous les prix sont en dollars canadiens avant taxes et incluent une fourchette typique. Paliers de prix : Vert jusqu'à 1,50 $ la portion, Beurre de 1,51 $ à 2,50 $ la portion, Tomate de 2,51 $ à 3,25 $ la portion."
